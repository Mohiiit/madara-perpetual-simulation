name: Simulation (Perpetual)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      madara_ref:
        description: "Madara ref to test (branch or commit)."
        required: false
        default: ""
      perpetual_sha:
        description: "Perpetual commit SHA override."
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    env:
      MADARA_REPO: https://github.com/madara-alliance/madara.git
      PERPETUAL_REPO: https://github.com/starkware-libs/starknet-perpetual.git
      MADARA_MAIN_BRANCH: ${{ vars.MADARA_MAIN_BRANCH }}
      PERPETUAL_PINNED_SHA: ${{ vars.PERPETUAL_PINNED_SHA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MADARA_REF_INPUT: ${{ github.event.inputs.madara_ref }}
      PERPETUAL_SHA_INPUT: ${{ github.event.inputs.perpetual_sha }}

    steps:
      - name: Checkout simulation repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 19 toolchain (Madara parity)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-19 llvm-19 llvm-19-dev llvm-19-runtime \
            libmlir-19-dev mlir-19-tools \
            libpolly-19-dev liblld-19-dev

          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-19/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-19/bin/clang++ 100

          echo "MLIR_SYS_190_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
          echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
          echo "TABLEGEN_190_PREFIX=/usr/lib/llvm-19" >> "$GITHUB_ENV"
          echo "CC=clang-19" >> "$GITHUB_ENV"
          echo "CXX=clang-19" >> "$GITHUB_ENV"
          echo "LDFLAGS=-fuse-ld=lld-19" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.15.1"

      - name: Install dependencies
        run: npm ci

      - name: Build simulation runner
        run: npm run build

      - name: Resolve runtime inputs
        run: |
          MADARA_REF="${MADARA_REF_INPUT}"
          if [ -z "$MADARA_REF" ]; then
            MADARA_REF="${MADARA_MAIN_BRANCH:-main}"
          fi

          PERPETUAL_SHA="${PERPETUAL_SHA_INPUT}"
          if [ -z "$PERPETUAL_SHA" ]; then
            PERPETUAL_SHA="${PERPETUAL_PINNED_SHA}"
          fi

          if [ -z "$PERPETUAL_SHA" ]; then
            echo "PERPETUAL_SHA is required. Set vars.PERPETUAL_PINNED_SHA or workflow input perpetual_sha." >&2
            exit 1
          fi

          echo "MADARA_REF=$MADARA_REF" >> "$GITHUB_ENV"
          echo "PERPETUAL_SHA=$PERPETUAL_SHA" >> "$GITHUB_ENV"

      - name: Download latest Madara binary artifact from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p .cache/madara
          ARTIFACTS_JSON="$(gh api 'repos/madara-alliance/madara/actions/artifacts?per_page=100')"

          ARTIFACT_ID="$(echo "$ARTIFACTS_JSON" | jq -r '
            .artifacts
            | map(select((.name | startswith("madara-binary-")) and (.expired == false) and (.workflow_run.head_branch == "main")))
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')"

          ARTIFACT_NAME="$(echo "$ARTIFACTS_JSON" | jq -r '
            .artifacts
            | map(select((.name | startswith("madara-binary-")) and (.expired == false) and (.workflow_run.head_branch == "main")))
            | sort_by(.created_at)
            | reverse
            | .[0].name // empty
          ')"

          ARTIFACT_RUN_ID="$(echo "$ARTIFACTS_JSON" | jq -r '
            .artifacts
            | map(select((.name | startswith("madara-binary-")) and (.expired == false) and (.workflow_run.head_branch == "main")))
            | sort_by(.created_at)
            | reverse
            | .[0].workflow_run.id // empty
          ')"

          if [ -z "$ARTIFACT_ID" ] || [ -z "$ARTIFACT_RUN_ID" ]; then
            echo "No non-expired madara-binary artifact found for madara main branch." >&2
            exit 1
          fi

          echo "Using Madara artifact: $ARTIFACT_NAME (id=$ARTIFACT_ID, run_id=$ARTIFACT_RUN_ID)"

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/madara-alliance/madara/actions/artifacts/$ARTIFACT_ID/zip" > .cache/madara/madara.zip

          unzip -o .cache/madara/madara.zip -d .cache/madara > /dev/null
          chmod +x .cache/madara/madara

          MADARA_COMMIT="$(gh api "repos/madara-alliance/madara/actions/runs/$ARTIFACT_RUN_ID" --jq '.head_sha')"

          echo "MADARA_BINARY_PATH=$GITHUB_WORKSPACE/.cache/madara/madara" >> "$GITHUB_ENV"
          echo "MADARA_COMMIT_OVERRIDE=$MADARA_COMMIT" >> "$GITHUB_ENV"
          echo "MADARA_ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "MADARA_ARTIFACT_RUN_ID=$ARTIFACT_RUN_ID" >> "$GITHUB_ENV"

      - name: Run simulation
        run: npm run simulate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
