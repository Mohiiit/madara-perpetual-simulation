name: Izanagi Simulation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      madara_ref:
        description: "Madara ref to test (branch or commit)."
        required: false
        default: ""
      perpetual_sha:
        description: "Perpetual commit SHA override."
        required: false
        default: ""
      backend:
        description: "Execution backend matrix"
        required: false
        default: "vm"
        type: choice
        options:
          - vm
          - native
          - both
      profile:
        description: "Traffic profile"
        required: false
        default: "balanced_soak"
      duration_override:
        description: "Optional runtime cap in ms"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      backend_matrix: ${{ steps.resolve.outputs.backend_matrix }}
      madara_ref: ${{ steps.resolve.outputs.madara_ref }}
      perpetual_sha: ${{ steps.resolve.outputs.perpetual_sha }}
      profile: ${{ steps.resolve.outputs.profile }}
      duration_override: ${{ steps.resolve.outputs.duration_override }}

    env:
      MADARA_MAIN_BRANCH: ${{ vars.MADARA_MAIN_BRANCH }}
      PERPETUAL_PINNED_SHA: ${{ vars.PERPETUAL_PINNED_SHA }}

    steps:
      - name: Resolve runtime inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"

          MADARA_REF="${{ github.event.inputs.madara_ref || '' }}"
          if [ -z "$MADARA_REF" ]; then
            MADARA_REF="${MADARA_MAIN_BRANCH:-main}"
          fi

          PERPETUAL_SHA="${{ github.event.inputs.perpetual_sha || '' }}"
          if [ -z "$PERPETUAL_SHA" ]; then
            PERPETUAL_SHA="${PERPETUAL_PINNED_SHA}"
          fi
          if [ -z "$PERPETUAL_SHA" ]; then
            echo "PERPETUAL_SHA is required. Set vars.PERPETUAL_PINNED_SHA or workflow input perpetual_sha." >&2
            exit 1
          fi

          PROFILE="${{ github.event.inputs.profile || 'balanced_soak' }}"
          DURATION_OVERRIDE="${{ github.event.inputs.duration_override || '' }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BACKEND_MATRIX='["vm"]'
          elif [ "$EVENT_NAME" = "schedule" ]; then
            BACKEND_MATRIX='["vm","native"]'
          else
            BACKEND_INPUT="${{ github.event.inputs.backend || 'vm' }}"
            if [ "$BACKEND_INPUT" = "both" ]; then
              BACKEND_MATRIX='["vm","native"]'
            elif [ "$BACKEND_INPUT" = "native" ]; then
              BACKEND_MATRIX='["native"]'
            else
              BACKEND_MATRIX='["vm"]'
            fi
          fi

          echo "backend_matrix=$BACKEND_MATRIX" >> "$GITHUB_OUTPUT"
          echo "madara_ref=$MADARA_REF" >> "$GITHUB_OUTPUT"
          echo "perpetual_sha=$PERPETUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "duration_override=$DURATION_OVERRIDE" >> "$GITHUB_OUTPUT"

  simulate:
    needs: prepare
    timeout-minutes: 70
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.prepare.outputs.backend_matrix) }}

    env:
      MADARA_REPO: https://github.com/madara-alliance/madara.git
      PERPETUAL_REPO: https://github.com/starkware-libs/starknet-perpetual.git
      MADARA_REF: ${{ needs.prepare.outputs.madara_ref }}
      PERPETUAL_SHA: ${{ needs.prepare.outputs.perpetual_sha }}
      SIM_PROFILE: ${{ needs.prepare.outputs.profile }}
      SIM_DURATION_OVERRIDE_MS: ${{ needs.prepare.outputs.duration_override }}
      SIM_BACKEND: ${{ matrix.backend }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SIM_REQUIRE_MADARA_ARTIFACT: "1"

    steps:
      - name: Checkout simulation repo
        uses: actions/checkout@v4

      - name: Install CI utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.15.1"

      - name: Install dependencies
        run: npm ci

      - name: Build simulation runner
        run: npm run build

      - name: Download Madara binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p .cache/madara
          TARGET_BRANCH="$MADARA_REF"
          if [[ "$TARGET_BRANCH" =~ ^[a-f0-9]{7,40}$ ]]; then
            TARGET_BRANCH="main"
          fi

          ARTIFACTS_JSON="$(gh api 'repos/madara-alliance/madara/actions/artifacts?per_page=100')"

          ARTIFACT_ID="$(echo "$ARTIFACTS_JSON" | jq -r --arg branch "$TARGET_BRANCH" '
            .artifacts
            | map(select((.name | startswith("madara-binary-")) and (.expired == false) and (.workflow_run.head_branch == $branch)))
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ')"

          if [ -z "$ARTIFACT_ID" ]; then
            TARGET_BRANCH="main"
            ARTIFACT_ID="$(echo "$ARTIFACTS_JSON" | jq -r '
              .artifacts
              | map(select((.name | startswith("madara-binary-")) and (.expired == false) and (.workflow_run.head_branch == "main")))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ')"
          fi

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No non-expired madara-binary artifact found." >&2
            exit 1
          fi

          ARTIFACT_NAME="$(echo "$ARTIFACTS_JSON" | jq -r --argjson id "$ARTIFACT_ID" '.artifacts[] | select(.id == $id) | .name')"
          ARTIFACT_RUN_ID="$(echo "$ARTIFACTS_JSON" | jq -r --argjson id "$ARTIFACT_ID" '.artifacts[] | select(.id == $id) | .workflow_run.id')"

          if [ -z "$ARTIFACT_RUN_ID" ]; then
            echo "Could not resolve workflow run for madara artifact id=$ARTIFACT_ID." >&2
            exit 1
          fi

          echo "Using Madara artifact: $ARTIFACT_NAME (id=$ARTIFACT_ID, run_id=$ARTIFACT_RUN_ID, branch=$TARGET_BRANCH)"

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/madara-alliance/madara/actions/artifacts/$ARTIFACT_ID/zip" > .cache/madara/madara.zip

          unzip -o .cache/madara/madara.zip -d .cache/madara > /dev/null
          chmod +x .cache/madara/madara

          MADARA_COMMIT="$(gh api "repos/madara-alliance/madara/actions/runs/$ARTIFACT_RUN_ID" --jq '.head_sha')"

          echo "MADARA_BINARY_PATH=$GITHUB_WORKSPACE/.cache/madara/madara" >> "$GITHUB_ENV"
          echo "MADARA_COMMIT_OVERRIDE=$MADARA_COMMIT" >> "$GITHUB_ENV"
          echo "MADARA_ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "MADARA_ARTIFACT_RUN_ID=$ARTIFACT_RUN_ID" >> "$GITHUB_ENV"
          echo "MADARA_ARTIFACT_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Run simulation
        run: npm run simulate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izanagi-reports-${{ matrix.backend }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
